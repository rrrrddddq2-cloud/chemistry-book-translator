<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاموس الكيمياء - Chemistry Dictionary</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dictionary-styles.css">
</head>
<body>
    <div class="container">
        <div class="dictionary-app">
            <header>
                <h1>📚 قاموس الكيمياء</h1>
                <p>قاموس متخصص لترجمة المصطلحات الكيميائية بدقة</p>
            </header>

            <div class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="ابحث عن مصطلح كيميائي..." 
                    class="search-input"
                >
                <div class="search-filters">
                    <button class="filter-btn active" data-lang="all">جميع اللغات</button>
                    <button class="filter-btn" data-lang="ar">عربي فقط</button>
                    <button class="filter-btn" data-lang="en">English Only</button>
                </div>
            </div>

            <div class="books-section">
                <h2>📖 اختر الكتاب:</h2>
                <div id="booksList" class="books-grid">
                    <!-- يتم إضافة الكتب هنا ديناميكياً -->
                </div>
            </div>

            <div id="termsContainer" class="terms-container">
                <div id="termsList" class="terms-grid">
                    <!-- يتم إضافة المصطلحات هنا ديناميكياً -->
                </div>
            </div>

            <div class="action-buttons">
                <button id="exportDictBtn" class="export-btn">📥 تصدير القاموس</button>
                <button id="printBtn" class="print-btn">🖨️ طباعة</button>
                <button id="backBtn" class="back-btn" style="display: none;">← العودة</button>
            </div>
        </div>
    </div>

    <script src="dictionary-script.js"></script>
</body>
</html>
